<script>
/* ==================== Utilities ==================== */
const KHD = '០១២៣៤៥៦៧៨៩';
const km = s => String(s).replace(/[0-9]/g, d => KHD[+d]);
const LETTERS = ['ក','ខ','គ','ឃ'];

let _seed = 13572468;
function rnd(){
  _seed = (Math.imul(_seed, 1664525) + 1013904223) & 0x7fffffff;
  return _seed / 2147483648;
}
function ri(a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function mkItem(q, ans, dis, ex){
  const all = [ans];
  const used = new Set([ans]);
  for (const s of dis){
    if (all.length === 4) break;
    if (used.has(s)) continue;
    used.add(s);
    all.push(s);
  }
  while (all.length < 4) all.push(ans + '…');
  const opts = shuffle(all);
  const it = { q, o: opts, a: opts.indexOf(ans) };
  if (ex) it.ex = ex;
  return it;
}

/* ==================== ថ្នាក់ទី១ (៤០) ==================== */
function G1(){
  const out = [];
  // ១.១ ព្យញ្ជនៈ
  const cons = [['ក','កោ','កោះ'],['ខ','ខៃ','ខៃ'],['គ','គោ','គោ'],['ឃ','ឃ្មុំ','ឃ្មុំ'],['ង','ងូត','ងូត'],
                ['ច','ចោ','ចោ'],['ឆ','ឆៃ','ឆៃ'],['ជ','ជើង','ជើង'],['ឈ','ឈើ','ឈើ'],['ញ','ញាតិ','ញាតិ']];
  for (let i = 0; i < 10; i++){
    const c = cons[i];
    out.push(mkItem(`តើអក្សរ "${c[0]}" ជាព្យញ្ជនៈ ឬស្រៈ?`, 'ព្យញ្ជនៈ', ['ស្រៈ','លេខ','សញ្ញា'], 'ព្យញ្ជនៈខ្មែរមាន ៣៣ តួ'));
  }
  // ១.២ ស្រៈ
  for (let i = 0; i < 8; i++){
    const v = ['ា','ិ','ី','ឹ','ឺ','ុ','ូ','េ'][i];
    out.push(mkItem(`តើសញ្ញា "${v}" ជាស្រៈ ឬព្យញ្ជនៈ?`, 'ស្រៈ', ['ព្យញ្ជនៈ','លេខ','វណ្ណយុត្តិ'], 'ស្រៈខ្មែរមាន ២៣ តួ'));
  }
  // ១.៣ លេខ
  for (let i = 0; i < 7; i++){
    const n = ri(1, 9);
    out.push(mkItem(`តើលេខ ${km(n)} អានថាដូចម្តេច?`, ['មួយ','ពីរ','បី','បួន','ប្រាំ','ប្រាំមួយ','ប្រាំពីរ','ប្រាំបី','ប្រាំបួន'][n-1],
      ['មួយ','ពីរ','បី','បួន','ប្រាំ','ប្រាំមួយ','ប្រាំពីរ','ប្រាំបី','ប្រាំបួន'].filter(x => x !== ['មួយ','ពីរ','បី','បួន','ប្រាំ','ប្រាំមួយ','ប្រាំពីរ','ប្រាំបី','ប្រាំបួន'][n-1]).slice(0,3)));
  }
  // ១.៤ ពាក្យសាមញ្ញ
  const words = [['ម៉ែ','ម្តាយ'],['ពុក','ឪពុក'],['ផ្ទះ','លំនៅ'],['សាលា','សាលារៀន'],['គ្រូ','គ្រូបង្រៀន']];
  for (let i = 0; i < 5; i++){
    out.push(mkItem(`តើពាក្យ "${words[i][0]}" មានន័យដូចពាក្យណា?`, words[i][1], ['ឆ្កែ','ឆ្មា','ជ្រូក'].filter(x => x !== words[i][1]), `"${words[i][0]}" និង "${words[i][1]}" មានន័យដូចគ្នា`));
  }
  // ១.៥ អានរូបភាព
  for (let i = 0; i < 5; i++){
    const animals = [['ឆ្កែ','សត្វចិញ្ចឹម'],['ឆ្មា','សត្វចិញ្ចឹម'],['គោ','សត្វចិញ្ចឹម'],['មាន់','សត្វចិញ្ចឹម'],['តោ','សត្វព្រៃ']];
    const a = animals[i];
    out.push(mkItem(`តើ "${a[0]}" ជាសត្វប្រភេទណា?`, a[1], ['សត្វព្រៃ','សត្វចិញ្ចឹម','សត្វសមុទ្រ'].filter(x => x !== a[1])));
  }
  // ១.៦ ប្រយោគខ្លី
  const sents = [['ខ្ញុំ','ទៅសាលា'],['ម៉ែ','ធ្វើបាយ'],['ពុក','ធ្វើការ'],['ឆ្កែ','ឬស'],['ឆ្មា','ចាប់កណ្តុរ']];
  for (let i = 0; i < 5; i++){
    const s = sents[i];
    out.push(mkItem(`តើប្រយោគណាត្រឹមត្រូវ?`, `${s[0]}${s[1]}`, [`${s[1]}${s[0]}`, `${s[0]}សាលា${s[1]}`, `${s[1]}${s[1]}`], `ប្រធាន + កិរិយាសព្ទ`));
  }
  return out;
}

/* ==================== ថ្នាក់ទី២ (៤០) ==================== */
function G2(){
  const out = [];
  // ២.១ ព្យញ្ជនៈ ៣៣ តួ
  out.push(mkItem('តើព្យញ្ជនៈខ្មែរមានប៉ុន្មានតួ?', '៣៣ តួ', ['២៣ តួ','១០ តួ','៤៤ តួ'], 'ព្យញ្ជនៈមាន ៣៣ តួ'));
  out.push(mkItem('តើស្រៈខ្មែរមានប៉ុន្មានតួ?', '២៣ តួ', ['៣៣ តួ','១០ តួ','៤៤ តួ'], 'ស្រៈមាន ២៣ តួ'));
  out.push(mkItem('តើលេខខ្មែរមានប៉ុន្មានតួ?', '១០ តួ', ['២៣ តួ','៣៣ តួ','២០ តួ'], 'លេខខ្មែរមាន ១០ តួ'));
  // ២.២ ព្យញ្ជនៈដំបូង/ចុងក្រោយ
  out.push(mkItem('តើព្យញ្ជនៈទី១ គឺតួអ្វី?', 'ក', ['ខ','អ','ហ'], 'ព្យញ្ជនៈទី១ គឺ ក'));
  out.push(mkItem('តើព្យញ្ជនៈចុងក្រោយ គឺតួអ្វី?', 'អ', ['ក','ហ','ខ'], 'ព្យញ្ជនៈចុងក្រោយ គឺ អ'));
  // ២.៣ ពាក្យផ្ទុយ
  const opp = [['ធំ','តូច'],['ខ្ពស់','ទាប'],['វែង','ខ្លី'],['ក្តៅ','ត្រជាក់'],['លឿន','យឺត']];
  for (let i = 0; i < 5; i++){
    out.push(mkItem(`ពាក្យផ្ទុយនឹង "${opp[i][0]}" គឺអ្វី?`, opp[i][1], ['ធំ','តូច','ខ្ពស់'].filter(x => x !== opp[i][1]), `ពាក្យផ្ទុយ`));
  }
  // ២.៤ ពាក្យសមន័យ
  const syn = [['ស្អាត','ល្អ'],['ឆ្លាត','វៃ'],['សប្បាយ','រីករាយ'],['លឿន','រហ័ស'],['ខ្លាំង','មាំ']];
  for (let i = 0; i < 5; i++){
    out.push(mkItem(`ពាក្យសមន័យនឹង "${syn[i][0]}" គឺអ្វី?`, syn[i][1], ['ខ្ជិល','យឺត','ទន់'].filter(x => x !== syn[i][1]), `ពាក្យសមន័យ`));
  }
  // ២.៥ ប្រយោគ
  for (let i = 0; i < 5; i++){
    const n = ri(2, 5);
    out.push(mkItem(`តើប្រយោគ "${n} នាក់" មានន័យដូចម្តេច?`, 'ចំនួនមនុស្ស', ['ចំនួនសត្វ','ចំនួនរបស់','ចំនួនថ្ងៃ'], 'នាក់ ប្រើសម្រាប់មនុស្ស'));
  }
  // ២.៦ វណ្ណយុត្តិ
  out.push(mkItem('តើសញ្ញា "។" ហៅថាអ្វី?', 'សញ្ញាខណ្ឌ', ['សញ្ញាសួរ','សញ្ញាឧទាន','សញ្ញាក្បៀស'], '។ ប្រើបញ្ចប់ប្រយោគ'));
  out.push(mkItem('តើសញ្ញា "?" ហៅថាអ្វី?', 'សញ្ញាសួរ', ['សញ្ញាខណ្ឌ','សញ្ញាឧទាន','សញ្ញាក្បៀស'], '? ប្រើសម្រាប់សួរ'));
  out.push(mkItem('តើសញ្ញា "!" ហៅថាអ្វី?', 'សញ្ញាឧទាន', ['សញ្ញាខណ្ឌ','សញ្ញាសួរ','សញ្ញាក្បៀស'], '! ប្រើសម្រាប់ឧទាន'));
  // ២.៧ ពាក្យសម្រាប់ការគោរព
  out.push(mkItem('តើពាក្យណាប្រើសម្រាប់គោរពគ្រូ?', 'លោកគ្រូ', ['ឯង','ម្នាក់','ចោរ'], 'ប្រើពាក្យគោរព'));
  out.push(mkItem('តើពាក្យណាប្រើសម្រាប់គោរពម្តាយ?', 'លោកម្តាយ', ['នាង','អ្នកនោះ','គាត់'], 'ប្រើពាក្យគោរព'));
  return out;
}

/* ==================== ថ្នាក់ទី៣ (៤០) ==================== */
function G3(){
  const out = [];
  // ៣.១ ថ្នាក់ពាក្យ
  const pos = [['សាលា','នាម'],['រត់','កិរិយាសព្ទ'],['ស្អាត','គុណនាម'],['គាត់','សព្ទនាម'],['នៅ','ធ្នាក់']];
  for (let i = 0; i < 5; i++){
    out.push(mkItem(`តើពាក្យ "${pos[i][0]}" ជាថ្នាក់ពាក្យអ្វី?`, pos[i][1], ['នាម','កិរិយាសព្ទ','គុណនាម'].filter(x => x !== pos[i][1]), `ថ្នាក់ពាក្យ`));
  }
  // ៣.២ ឈ្នាប់
  for (let i = 0; i < 4; i++){
    const conj = ['និង','ឬ','តែ','ព្រោះ'][i];
    out.push(mkItem(`តើពាក្យ "${conj}" ជាថ្នាក់ពាក្យអ្វី?`, 'ឈ្នាប់', ['នាម','កិរិយាសព្ទ','ធ្នាក់'], 'ឈ្នាប់ភ្ជាប់ពាក្យ/ប្រយោគ'));

/* ==================== ការបង្ហាញ ==================== */
const app = document.getElementById('app');
const scoreEl = document.getElementById('score');
const totalEl = document.getElementById('total');
const navEl = document.getElementById('secnav');
let correctCount = 0;

function render(){
  correctCount = 0;
  scoreEl.textContent = km(0);

  let html = '';
  let n = 0;

  DATA.forEach(sec => {
    html += '<section class="section" id="' + sec.id + '">';
    html += '<h2>' + sec.title + '</h2>';
    html += '<p class="desc">' + sec.desc + '</p>';

    sec.items.forEach(it => {
      if (it.p){ html += '<div class="passage">' + it.p + '</div>'; return; }

      n++;
      html += '<div class="q">';
      html += '<div class="qtext"><span class="num">' + km(n) + '.</span> ' + km(it.q) + '</div>';
      html += '<div class="opts">';
      it.o.forEach((txt, i) => {
        html += '<button class="opt" data-i="' + i + '" data-a="' + it.a + '">'
              + LETTERS[i] + '. ' + km(txt) + '</button>';
      });
      html += '</div>';
      let ansHtml = 'ចម្លើយត្រឹមត្រូវ៖ ' + LETTERS[it.a] + '. ' + km(it.o[it.a]);
      if (it.ex){
        ansHtml += '<br><span style="font-weight:400;color:#4a5a72;font-size:13.5px">' + km(it.ex) + '</span>';
      }
      html += '<div class="ans">' + ansHtml + '</div>';
      html += '</div>';
    });

    html += '</section>';
  });

  app.innerHTML = html;
  totalEl.textContent = km(n);

  navEl.innerHTML = DATA.map((s, i) =>
    '<a href="#' + s.id + '">' + km(i + 1) + '. ' + s.title.replace(/\s*\(.*\)$/, '') + '</a>'
  ).join('');
}

/* ចុចជម្រើស */
app.addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;

  const qEl = btn.closest('.q');
  const opts = qEl.querySelectorAll('.opt');
  const ansEl = qEl.querySelector('.ans');
  const chosen = +btn.dataset.i;
  const correct = +btn.dataset.a;

  if (chosen === correct){
    btn.classList.add('correct');
    opts.forEach(b => b.disabled = true);
    ansEl.classList.add('show');
    correctCount++;
    scoreEl.textContent = km(correctCount);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
  }
});

/* ប៊ូតុង */
document.getElementById('btnShowAll').addEventListener('click', () => {
  document.querySelectorAll('.q').forEach(qEl => {
    qEl.querySelectorAll('.opt').forEach(b => {
      if (+b.dataset.i === +b.dataset.a){
        b.classList.add('correct');
      }
      b.disabled = true;
    });
    qEl.querySelector('.ans').classList.add('show');
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('btnPrint').addEventListener('click', () => {
  document.body.classList.remove('print-answers');
  window.print();
});

document.getElementById('btnPrintAns').addEventListener('click', () => {
  document.body.classList.add('print-answers');
  window.print();
});

window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-answers');
});

/* ចាប់ផ្តើម */
render();
