/* ============================================================

   ============================================================ */
const app = document.getElementById('app');
const scoreEl = document.getElementById('score');
const totalEl = document.getElementById('total');
let correctCount = 0;

function render(){
  correctCount = 0;
  scoreEl.textContent = km(0);

  let html = '';
  let n = 0;

  DATA.forEach(sec => {
    html += '<section class="section">';
    html += '<h2>' + sec.title + '</h2>';
    html += '<p class="desc">' + sec.desc + '</p>';

    sec.items.forEach(it => {
      if (it.p){ html += '<div class="passage">' + it.p + '</div>'; return; }

      n++;
      html += '<div class="q">';
      html += '<div class="qtext"><span class="num">' + km(n) + '.</span> ' + it.q + '</div>';

      if (it.o){
        html += '<div class="opts">';
        it.o.forEach((txt, i) => {
          html += '<button class="opt" data-n="' + n + '" data-i="' + i + '" data-a="' + it.a + '">'
                + LETTERS[i] + '. ' + txt + '</button>';
        });
        html += '</div>';
        html += '<div class="ans" id="ans-' + n + '">ចម្លើយត្រឹមត្រូវ៖ '
              + LETTERS[it.a] + '. ' + it.o[it.a] + '</div>';
      } else {
        html += '<div class="ans" id="ans-' + n + '">ចម្លើយ៖ ' + it.ans + '</div>';
      }

      html += '</div>';
    });

    html += '</section>';
  });

  app.innerHTML = html;
  totalEl.textContent = km(n);
  bind();
}

function bind(){
  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const n = btn.dataset.n;
      const i = +btn.dataset.i;
      const a = +btn.dataset.a;
      const box = btn.parentElement;

      if (i === a){
        btn.classList.add('correct');
        box.querySelectorAll('.opt').forEach(b => b.disabled = true);
        document.getElementById('ans-' + n).classList.add('show');
        correctCount++;
        scoreEl.textContent = km(correctCount);
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
      }
    });
  });
}

/* ប៊ូតុង */
document.getElementById('btnShowAll').addEventListener('click', () => {
  document.querySelectorAll('.ans').forEach(e => e.classList.add('show'));
  document.querySelectorAll('.opt').forEach(b => {
    if (+b.dataset.i === +b.dataset.a){
      b.classList.add('correct');
      b.disabled = true;
    }
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('btnPrint').addEventListener('click', () => {
  document.body.classList.remove('print-answers');
  window.print();
});

document.getElementById('btnPrintAns').addEventListener('click', () => {
  document.body.classList.add('print-answers');
  window.print();
});

window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-answers');
});

/* ចាប់ផ្តើម */
render();
</script>
