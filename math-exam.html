<script>
/* ==================== Utilities ==================== */
const KHD = '០១២៣៤៥៦៧៨៩';
const km = s => String(s).replace(/[0-9]/g, d => KHD[+d]);

let _seed = 24681357;
function rnd(){
  _seed = (Math.imul(_seed, 1664525) + 1013904223) & 0x7fffffff;
  return _seed / 2147483648;
}
function ri(a, b){ return a + Math.floor(rnd() * (b - a + 1)); }
function pick(arr){ return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function gcd(a, b){
  a = Math.abs(a); b = Math.abs(b);
  while (b){ const t = a % b; a = b; b = t; }
  return a || 1;
}
function fn(x){
  const r = Math.round(x * 100) / 100;
  let s = r.toFixed(2);
  if (s.endsWith('.00')) s = s.slice(0, -3);
  else if (s.endsWith('0')) s = s.slice(0, -1);
  return s;
}

/* ==================== Item builders ==================== */
function mkItem(q, ans, dis, ex){
  const used = new Set([ans]);
  const all = [ans];
  for (const s of dis){
    if (all.length === 4) break;
    if (used.has(s)) continue;
    used.add(s);
    all.push(s);
  }
  const opts = shuffle(all);
  const it = { q, o: opts, a: opts.indexOf(ans) };
  if (ex) it.ex = ex;
  return it;
}

/* លំហាត់លេខ (ចំនួនគត់ ឬទសភាគ) */
function numQ(q, ansNum, ex){
  const ans = fn(ansNum);
  const used = new Set([ans]);
  const dis = [];
  const A = Math.abs(ansNum);

  let steps;
  if (A >= 1000)      steps = [1, 10, 100, -1, -10, -100, 0.5, 2];
  else if (A >= 100)  steps = [1, 10, -1, -10, 0.5, -0.5, 2, -2];
  else if (A >= 10)   steps = [1, 2, -1, -2, 0.5, -0.5, 0.1];
  else if (A >= 1)    steps = [0.1, 0.2, -0.1, -0.2, 0.5, -0.5, 1];
  else                steps = [0.01, 0.05, 0.1, -0.01, -0.05, -0.1];

  if (Number.isInteger(ansNum)) steps = steps.filter(s => Number.isInteger(s));

  let guard = 0;
  while (dis.length < 3 && guard++ < 400){
    const d = pick(steps);
    const v = Math.round((ansNum + d) * 100) / 100;
    if (v <= 0) continue;
    const s = fn(v);
    if (used.has(s)) continue;
    used.add(s); dis.push(s);
  }
  let k = 1;
  while (dis.length < 3){
    const s = fn(ansNum * 2 + k * 7);
    if (!used.has(s)){ used.add(s); dis.push(s); }
    k++;
  }
  return mkItem(q, ans, dis, ex);
}

/* លំហាត់ប្រភាគ */
function fracQ(q, n, d, ex){
  const g0 = gcd(n, d);
  n = n / g0; d = d / g0;
  const ans = d === 1 ? String(n) : n + '/' + d;
  const used = new Set([ans]);
  const dis = [];
  let guard = 0;
  while (dis.length < 3 && guard++ < 1500){
    const nn = Math.max(1, n + ri(-3, 3));
    const dd = Math.max(1, d + ri(-3, 3));
    if (nn * d === n * dd) continue;
    const g1 = gcd(nn, dd);
    const a2 = nn / g1, b2 = dd / g1;
    const s = b2 === 1 ? String(a2) : a2 + '/' + b2;
    if (used.has(s)) continue;
    used.add(s); dis.push(s);
  }
  let k = 1;
  while (dis.length < 3){
    const nn = n + 3 * k, dd = d;
    const g1 = gcd(nn, dd);
    const a2 = nn / g1, b2 = dd / g1;
    const s = b2 === 1 ? String(a2) : a2 + '/' + b2;
    if (!used.has(s)){ used.add(s); dis.push(s); }
    k++;
  }
  return mkItem(q, ans, dis, ex);
}

/* លំហាត់ជាមួយជម្រើសកំណត់ដោយដៃ */
function customQ(q, ans, dis, ex){
  return mkItem(q, ans, dis, ex);
}

/* ==================== ផ្នែកទី១៖ ប្រតិបត្តិការ (១០០) ==================== */
function S1(){
  const out = [];
  for (let i = 0; i < 25; i++){
    let a, b;
    if (i < 15){ a = ri(10, 99); b = ri(10, 99); }
    else { a = ri(100, 899); b = ri(100, 899); }
    out.push(numQ(`${a} + ${b} = ?`, a + b));
  }
  for (let i = 0; i < 25; i++){
    let a, b;
    if (i < 15){ b = ri(10, 89); a = ri(b + 1, 99); }
    else { b = ri(100, 799); a = ri(b + 1, 999); }
    out.push(numQ(`${a} − ${b} = ?`, a - b));
  }
  for (let i = 0; i < 25; i++){
    let a, b;
    if (i < 10){ a = ri(2, 9); b = ri(2, 9); }
    else if (i < 20){ a = ri(10, 99); b = ri(2, 9); }
    else { a = ri(10, 99); b = ri(10, 19); }
    out.push(numQ(`${a} × ${b} = ?`, a * b));
  }
  for (let i = 0; i < 25; i++){
    let b, q;
    if (i < 10){ b = ri(2, 9); q = ri(2, 9); }
    else if (i < 20){ b = ri(2, 9); q = ri(10, 30); }
    else { b = ri(10, 19); q = ri(2, 12); }
    out.push(numQ(`${b * q} ÷ ${b} = ?`, q));
  }
  return out;
}

/* ==================== ផ្នែកទី២៖ ប្រភាគ (៧០) ==================== */
function S2(){
  const out = [];
  const dens = [4, 5, 6, 7, 8, 9, 10, 12];

  /* ២.១ បូក/ដកប្រភាគភាគបែងស្មើ (២៥) */
  let cnt = 0, guard = 0;
  while (cnt < 15 && guard++ < 4000){
    const d = pick(dens);
    const a = ri(1, d - 2);
    const b = ri(1, d - 1 - a);
    if (a + b >= d) continue;
    if (gcd(a + b, d) !== 1) continue;
    out.push(fracQ(`${a}/${d} + ${b}/${d} = ?`, a + b, d, `ភាគបែងស្មើ ដូច្នេះបូកភាគយក`));
    cnt++;
  }
  cnt = 0; guard = 0;
  while (cnt < 10 && guard++ < 4000){
    const d = pick(dens);
    const b = ri(1, d - 2);
    const a = ri(b + 1, d - 1);
    if (gcd(a - b, d) !== 1) continue;
    out.push(fracQ(`${a}/${d} − ${b}/${d} = ?`, a - b, d, `ភាគបែងស្មើ ដូច្នេះដកភាគយក`));
    cnt++;
  }

  /* ២.២ គុណ/ចែកប្រភាគ (១៥) */
  for (let i = 0; i < 8; i++){
    const b = ri(2, 9), d = ri(2, 9);
    const a = ri(1, b - 1), c = ri(1, d - 1);
    out.push(fracQ(`${a}/${b} × ${c}/${d} = ?`, a * c, b * d, `គុណភាគយកនឹងភាគយក ភាគបែងនឹងភាគបែង`));
  }
  for (let i = 0; i < 7; i++){
    const b = ri(2, 9), d = ri(2, 9);
    const a = ri(1, b - 1), c = ri(1, d - 1);
    out.push(fracQ(`${a}/${b} ÷ ${c}/${d} = ?`, a * d, b * c, `ចែក = គុណនឹងប្រភាគច្រាស`));
  }

  /* ២.៣ បំប្លែងប្រភាគ (១៥) */
  for (let i = 0; i < 5; i++){
    const d = ri(2, 9), w = ri(1, 5), r = ri(1, d - 1);
    const n = w * d + r;
    out.push(customQ(`${n}/${d} = ? (បំប្លែងជាចំនួនលាយ)`, `${w} ${r}/${d}`,
      [`${w + 1} ${r}/${d}`, `${Math.max(1, w - 1)} ${r}/${d}`, `${w} ${r + 1}/${d}`, `${w} ${Math.max(1, r - 1)}/${d}`, `${w + 2} ${r}/${d}`],
      `ចែក ${n} នឹង ${d} បាន ${w} សល់ ${r}`));
  }
  for (let i = 0; i < 5; i++){
    const d = ri(3, 9), w = ri(1, 4), r = ri(1, d - 1);
    const n = w * d + r;
    out.push(customQ(`${w} ${r}/${d} = ? (បំប្លែងជាប្រភាគមិនល្អ)`, `${n}/${d}`,
      [`${w + r}/${d}`, `${w * r}/${d}`, `${n + 1}/${d}`, `${n}/${d + 1}`, `${w}/${d}`],
      `គុណចំនួនគត់នឹងភាគបែង បូកភាគយក`));
  }
  for (let i = 0; i < 5; i++){
    let bn, bd, g = 0, guard2 = 0;
    do {
      bn = ri(1, 5); bd = ri(2, 7);
    } while (gcd(bn, bd) !== 1 && guard2++ < 200);
    g = ri(2, 5);
    const n = bn * g, d = bd * g;
    out.push(customQ(`សម្រួលប្រភាគ ${n}/${d}`, `${bn}/${bd}`,
      [`${n}/${d}`, `${bn + 1}/${bd}`, `${bn}/${bd + 1}`, `${bn}/${bd * 2}`, `${bn + 1}/${bd + 1}`],
      `ចែកភាគយក និងភាគបែងនឹង ${g}`));
  }

  /* ២.៤ ប្រៀបធៀបប្រភាគ (១៥) */
  function orderQ(largest){
    const fr = [];
    const used = new Set();
    let g3 = 0;
    while (fr.length < 4 && g3++ < 600){
      const d = ri(3, 12);
      const n = ri(1, d * 2);
      const gg = gcd(n, d);
      const s = (n / gg) + '/' + (d / gg);
      if (used.has(s)) continue;
      used.add(s);
      fr.push({ s, v: n / d });
    }
    fr.sort((x, y) => x.v - y.v);
    const ans = largest ? fr[fr.length - 1].s : fr[0].s;
    const opts = fr.map(x => x.s);
    return { q: largest ? 'តើប្រភាគណាធំជាងគេ?' : 'តើប្រភាគណាតូចជាងគេ?', o: opts, a: opts.indexOf(ans) };
  }
  for (let i = 0; i < 8; i++) out.push(orderQ(true));
  for (let i = 0; i < 7; i++) out.push(orderQ(false));

  return out;
}

/* ==================== ផ្នែកទី៣៖ ទសភាគ (៦០) ==================== */
function S3(){
  const out = [];

  /* ៣.១ បូក/ដក (២០) */
  for (let i = 0; i < 10; i++){
    const A = ri(100, 9999), B = ri(100, 9999);
    out.push(numQ(`${fn(A / 100)} + ${fn(B / 100)} = ?`, (A + B) / 100));
  }
  for (let i = 0; i < 10; i++){
    let A = ri(200, 9999), B = ri(100, 9999);
    if (B > A){ const t = A; A = B; B = t; }
    out.push(numQ(`${fn(A / 100)} − ${fn(B / 100)} = ?`, (A - B) / 100));
  }

  /* ៣.២ គុណ/ចែក (២០) */
  for (let i = 0; i < 10; i++){
    const A = ri(11, 999), b = ri(2, 9);
    out.push(numQ(`${fn(A / 100)} × ${b} = ?`, (A * b) / 100));
  }
  for (let i = 0; i < 10; i++){
    const b = ri(2, 9), q = ri(11, 200);
    out.push(numQ(`${fn((q * b) / 100)} ÷ ${b} = ?`, q / 100));
  }

  /* ៣.៣ បំប្លែង និងបង្គត់ (២០) */
  const fds = [
    [1, 2, 0.5], [1, 4, 0.25], [3, 4, 0.75], [1, 5, 0.2],
    [2, 5, 0.4], [3, 5, 0.6], [4, 5, 0.8], [1, 8, 0.125],
    [3, 8, 0.375], [5, 8, 0.625], [1, 10, 0.1], [3, 10, 0.3],
    [7, 10, 0.7], [9, 10, 0.9], [1, 20, 0.05], [1, 25, 0.04]
  ];
  const picked = shuffle(fds).slice(0, 7);
  for (const [n, d, dec] of picked){
    const s = fn(dec);
    const [ip, fp = ''] = s.split('.');
    const cands = [];
    if (fp.length >= 2){
      const rev = fp.split('').reverse().join('');
      if (rev !== fp) cands.push(ip + '.' + rev);
    }
    cands.push(fn(dec / 10));
    cands.push(fn(dec * 10));
    cands.push(fn(dec + 1));
    cands.push(fn(Math.max(0.01, dec - 1)));
    out.push(customQ(`${n}/${d} = ? (សរសេរជាទសភាគ)`, s, cands, `ចែក ${n} នឹង ${d}`));
  }

  const dfs = [
    ['0.5', '1/2'], ['0.25', '1/4'], ['0.75', '3/4'], ['0.2', '1/5'],
    ['0.4', '2/5'], ['0.6', '3/5'], ['0.8', '4/5'], ['0.1', '1/10'],
    ['0.125', '1/8'], ['0.05', '1/20']
  ];
  const picked2 = shuffle(dfs).slice(0, 7);
  for (const [dec, frac] of picked2){
    const [n, d] = frac.split('/').map(Number);
    out.push(customQ(`${dec} = ? (សរសេរជាប្រភាគ)`, frac,
      [d + '/' + n, (n + 1) + '/' + d, n + '/' + (d + 1), (n + 1) + '/' + (d + 1), n + '/' + (d * 2)],
      `${dec} = ${n}/${d}`));
  }

  for (let i = 0; i < 6; i++){
    const whole = ri(1, 20);
    const tenths = ri(1, 9);
    const val = whole + tenths / 10;
    const rounded = Math.round(val);
    out.push(numQ(`បង្គត់ ${fn(val)} ទៅចំនួនគត់ជិតបំផុត`, rounded, `មើលខ្ទង់ដបភាគដប: ${tenths} ≥ 5 → បង្គត់ឡើង`));
  }

  return out;
}

/* ==================== ផ្នែកទី៦៖ ភាគរយ សមាមាត្រ មធ្យម (៦០) ==================== */
function S6(){
  const out = [];

  /* ៦.១ ភាគរយ (២០) */
  let cnt = 0, guard = 0;
  const ps = [5, 10, 15, 20, 25, 30, 40, 50, 60, 75, 80];
  const bases = [20, 40, 50, 60, 80, 100, 120, 200, 250, 400, 500];
  while (cnt < 20 && guard++ < 3000){
    const p = pick(ps), b = pick(bases);
    const ans = (p * b) / 100;
    if (!Number.isInteger(ans)) continue;
    out.push(numQ(`${p}% នៃ ${b} = ?`, ans, `គុណ ${b} នឹង ${p} រួចចែកនឹង ១០០`));
    cnt++;
  }

  /* ៦.២ សមាមាត្រ (២០) */
  for (let i = 0; i < 8; i++){
    const g = ri(2, 6);
    const a = ri(1, 6), b = ri(a + 1, 9);
    const n1 = a * g, n2 = b * g;
    out.push(customQ(`សម្រួលសមាមាត្រ ${n1} : ${n2}`, `${a} : ${b}`,
      [`${b} : ${a}`, `${a + 1} : ${b}`, `${a} : ${b + 1}`, `${n1} : ${n2}`, `${a * 2} : ${b}`],
      `ចែកទាំងពីរនឹង ${g}`));
  }
  for (let i = 0; i < 7; i++){
    const a = ri(1, 5), b = ri(a + 1, 8), k = ri(2, 6);
    out.push(numQ(`${a} : ${b} = ${a * k} : ?`, b * k, `គុណភាគពីរនឹង ${k}`));
  }
  for (let i = 0; i < 5; i++){
    const g = ri(2, 10);
    const a = ri(1, 4), b = ri(a + 1, 6);
    const total = (a + b) * g;
    const share = a * g;
    out.push(numQ(`ចែកចំនួន ${total} តាមសមាមាត្រ ${a} : ${b}។ តើចំណែកតូចប៉ុន្មាន?`, share, `ចំនួនផ្នែកសរុប = ${a + b} ផ្នែក`));
  }

  /* ៦.៣ មធ្យម (២០) */
  for (let i = 0; i < 20; i++){
    const k = ri(3, 5);
    const nums = [];
    let sum = 0;
    for (let j = 0; j < k; j++){
      const v = ri(5, 50);
      nums.push(v);
      sum += v;
    }
    const avg = sum / k;
    if (!Number.isInteger(avg)){
      const diff = (k - (sum % k)) % k;
      nums[0] += diff;
      sum += diff;
    }
    out.push(numQ(`រកមធ្យមនៃចំនួន ${nums.join(', ')}`, sum / k, `បូកទាំងអស់ រួចចែកនឹង ${k}`));
  }

  return out;
}

/* ==================== ការបង្ហាញ ==================== */
const LETTERS = ['ក','ខ','គ','ឃ'];
const app = document.getElementById('app');
const scoreEl = document.getElementById('score');
const totalEl = document.getElementById('total');
const navEl = document.getElementById('secnav');
let correctCount = 0;

function render(){
  correctCount = 0;
  scoreEl.textContent = km(0);

  let html = '';
  let n = 0;

  DATA.forEach(sec => {
    html += '<section class="section" id="' + sec.id + '">';
    html += '<h2>' + sec.title + '</h2>';
    html += '<p class="desc">' + sec.desc + '</p>';

    sec.items.forEach(it => {
      n++;
      html += '<div class="q">';
      html += '<div class="qtext"><span class="num">' + km(n) + '.</span> ' + km(it.q) + '</div>';
      html += '<div class="opts">';
      it.o.forEach((txt, i) => {
        html += '<button class="opt" data-i="' + i + '" data-a="' + it.a + '">'
              + LETTERS[i] + '. ' + km(txt) + '</button>';
      });
      html += '</div>';
      let ansHtml = 'ចម្លើយត្រឹមត្រូវ៖ ' + LETTERS[it.a] + '. ' + km(it.o[it.a]);
      if (it.ex){
        ansHtml += '<br><span style="font-weight:400;color:#4a5a72;font-size:13.5px">' + km(it.ex) + '</span>';
      }
      html += '<div class="ans">' + ansHtml + '</div>';
      html += '</div>';
    });

    html += '</section>';
  });

  app.innerHTML = html;
  totalEl.textContent = km(n);

  navEl.innerHTML = DATA.map((s, i) =>
    '<a href="#' + s.id + '">' + km(i + 1) + '. ' + s.title.replace(/^ផ្នែកទី[^៖]*៖\s*/, '').replace(/\s*\(.*\)$/, '') + '</a>'
  ).join('');
}

/* ចុចជម្រើស */
app.addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;

  const qEl = btn.closest('.q');
  const opts = qEl.querySelectorAll('.opt');
  const ansEl = qEl.querySelector('.ans');
  const chosen = +btn.dataset.i;
  const correct = +btn.dataset.a;

  if (chosen === correct){
    btn.classList.add('correct');
    opts.forEach(b => b.disabled = true);
    ansEl.classList.add('show');
    correctCount++;
    scoreEl.textContent = km(correctCount);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
  }
});

/* ប៊ូតុង */
document.getElementById('btnShowAll').addEventListener('click', () => {
  document.querySelectorAll('.q').forEach(qEl => {
    qEl.querySelectorAll('.opt').forEach(b => {
      if (+b.dataset.i === +b.dataset.a){
        b.classList.add('correct');
      }
      b.disabled = true;
    });
    qEl.querySelector('.ans').classList.add('show');
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('btnPrint').addEventListener('click', () => {
  document.body.classList.remove('print-answers');
  window.print();
});

document.getElementById('btnPrintAns').addEventListener('click', () => {
  document.body.classList.add('print-answers');
  window.print();
});

window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-answers');
});

/* ចាប់ផ្តើម */
render();
</script>
</body>
</html>
